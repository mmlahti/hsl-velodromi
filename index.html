<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSL lähdöt Velodromi</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .stop-container {
            margin-bottom: 30px;
        }
        h2 {
            font-size: 28px; 
            margin-top: 0;
            margin-bottom: 12px;
            border-bottom: 3px solid #000000;
            padding-bottom: 8px;
            letter-spacing: 1px;
        }
        .departure {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #000000;
        }
        .departure:last-child {
            border-bottom: none;
        }
        .time {
            font-weight: bold;
            font-size: 24px; 
            min-width: 100px; 
        }
        .line {
            font-weight: bold;
            font-size: 24px; 
            min-width: 50px; 
			text-align: right;
        }
        .destination {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-left: 15px;
            font-size: 22px; 
        }
        .error {
            font-size: 18px;
            font-weight: bold;
            border: 3px solid #000000;
            padding: 15px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="all-stops">Ladataan aikatauluja...</div>

    <script>
        // 1. API-AVAIN
        const API_KEY = 'dd44817b14fe465c9122a1d123f369e8';
        
        // 2. MÄÄRITÄ PYSÄKIT JA NIIDEN OTSIKOT TÄSSÄ
        const STOPS = [
            { id: 'HSL:1173430', title: 'Kalasatamaan' },
            { id: 'HSL:1173429', title: 'Pasilaan' },
            { id: 'HSL:1173408', title: 'Kurviin' }
        ]; 

        const DEPARTURES_PER_STOP = 3;

        function formatTime(secondsFromMidnight, isRealtime) {
            const now = new Date();
            const currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            
            let diff = secondsFromMidnight - currentSeconds;
            
            if (diff > 43200) diff -= 86400;
            if (diff < -43200) diff += 86400;

            let timeString = '';

            if (diff > -60 && diff < 600) {
                const mins = Math.max(0, Math.floor(diff / 60));
                timeString = `${mins} min`;
            } else {
                const hours = Math.floor(secondsFromMidnight / 3600) % 24;
                const minutes = Math.floor((secondsFromMidnight % 3600) / 60);
                timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            }

            return isRealtime ? timeString : `~${timeString}`;
        }

        async function fetchSingleStop(stopConfig) {
            const query = `
            {
              stop(id: "${stopConfig.id}") {
                stoptimesWithoutPatterns(numberOfDepartures: ${DEPARTURES_PER_STOP}) {
                  realtimeDeparture
                  realtime
                  headsign
                  trip {
                    route {
                      shortName
                    }
                  }
                }
              }
            }`;

            const response = await fetch('https://api.digitransit.fi/routing/v2/hsl/gtfs/v1', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'digitransit-subscription-key': API_KEY
                },
                body: JSON.stringify({ query })
            });

            if (!response.ok) throw new Error(`Virhe haettaessa pysäkkiä ${stopConfig.id}`);
            const result = await response.json();
            
            return {
                customTitle: stopConfig.title,
                data: result.data.stop
            };
        }

        async function fetchAllStops() {
            try {
                const container = document.getElementById('all-stops');
                
                const stopPromises = STOPS.map(stop => fetchSingleStop(stop));
                const stopsResults = await Promise.all(stopPromises);
                
                container.innerHTML = ''; 

                stopsResults.forEach(result => {
                    const stop = result.data;
                    const customTitle = result.customTitle;

                    if (!stop) return; 

                    let stopHtml = `
                        <div class="stop-container">
                            <h2>${customTitle}</h2>
                    `;

                    if (stop.stoptimesWithoutPatterns.length === 0) {
                        stopHtml += `
                            <div class="departure">
                                <div class="destination">Ei lähtöjä lähiaikoina</div>
                            </div>
                        `;
                    } else {
                        stop.stoptimesWithoutPatterns.forEach(dep => {
                            const time = formatTime(dep.realtimeDeparture, dep.realtime);
                            const line = dep.trip.route.shortName;
                            const destination = dep.headsign || 'Päätepysäkki';

                            stopHtml += `
                                <div class="departure">
                                    <div class="time">${time}</div>
                                    <div class="line">${line}</div>
                                    <div class="destination">${destination}</div>
                                </div>
                            `;
                        });
                    }

                    stopHtml += `</div>`;
                    container.innerHTML += stopHtml;
                });

				// UUSI RIVI: Ilmoitetaan Blotchille, että data on päivitetty!
                // HUOM: Korvaa tämä URL sillä, jonka löysit HSL-widgetin asetuksista
                fetch('https://live.blotch.app/hook/frame/AVwxbJIXwdggYrqGgMYp/widget/RwriDsS4qcB1tH1c6C8T', { mode: 'no-cors' });
				
            } catch (error) {
                document.getElementById('all-stops').innerHTML = `
                    <div class="error">Virhe ladatessa tietoja:<br>${error.message}</div>
                `;
            }
        }

        fetchAllStops();
        setInterval(fetchAllStops, 60000);
    </script>
</body>
</html>
