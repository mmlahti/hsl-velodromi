<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSL Pysäkkinäyttö</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .stop-container {
            margin-bottom: 40px;
        }
        h2 {
            font-size: 36px;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 4px solid #000000;
            padding-bottom: 10px;
            letter-spacing: 1px;
        }
        .departure {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #000000;
        }
        .departure:last-child {
            border-bottom: none;
        }
        .time {
            font-weight: bold;
            font-size: 32px;
            min-width: 100px;
        }
        .line {
            font-weight: bold;
            font-size: 32px;
            min-width: 80px;
            text-align: left;
        }
        .destination {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-left: 20px;
            font-size: 28px;
        }
        .error {
            font-size: 24px;
            font-weight: bold;
            border: 4px solid #000000;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="all-stops">Ladataan aikatauluja...</div>

    <script>
        // 1. LISÄÄ TÄHÄN API-AVAIMESI
        const API_KEY = 'dd44817b14fe465c9122a1d123f369e8';
        
        // 2. MÄÄRITÄ PYSÄKIT JA NIIDEN OTSIKOT TÄSSÄ
        // Korvaa 'HSL:ID_TÄHÄN' -kohdat oikeilla GtfsId-tunnuksilla
        const STOPS = [
            { id: 'HSL:1173430', title: 'Kalasatamaan' },
            { id: 'HSL:1173429', title: 'Pasilaan' },
            { id: 'HSL:1173408', title: 'Kurviin' }
        ]; 
        const DEPARTURES_PER_STOP = 2;

        // UUDISTETTU AIKAMUOTOILU
        function formatTime(secondsFromMidnight) {
            const now = new Date();
            // Lasketaan laitteen nykyinen aika sekunteina vuorokauden alusta
            const currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            
            // Erotus sekunteina
            let diff = secondsFromMidnight - currentSeconds;
            
            // Korjataan vuorokauden vaihtumiseen liittyvät heitot (HSL käyttää >24h aikoja yövuoroissa)
            if (diff > 43200) diff -= 86400;
            if (diff < -43200) diff += 86400;

            // Jos lähtöön on alle 10 minuuttia (600 s) ja bussi ei ole jo mennyt (vähintään 0 min)
            if (diff > -60 && diff < 600) {
                const mins = Math.max(0, Math.floor(diff / 60));
                return `${mins} min`;
            }

            // Muussa tapauksessa näytetään normaali kellonaika (HH:MM)
            const hours = Math.floor(secondsFromMidnight / 3600) % 24;
            const minutes = Math.floor((secondsFromMidnight % 3600) / 60);
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
        }

        async function fetchSingleStop(stopConfig) {
            const query = `
            {
              stop(id: "${stopConfig.id}") {
                stoptimesWithoutPatterns(numberOfDepartures: ${DEPARTURES_PER_STOP}) {
                  realtimeDeparture
                  headsign
                  trip {
                    route {
                      shortName
                    }
                  }
                }
              }
            }`;

            const response = await fetch('https://api.digitransit.fi/routing/v2/hsl/gtfs/v1', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'digitransit-subscription-key': API_KEY
                },
                body: JSON.stringify({ query })
            });

            if (!response.ok) throw new Error(`Virhe haettaessa pysäkkiä ${stopConfig.id}`);
            const result = await response.json();
            
            return {
                customTitle: stopConfig.title,
                data: result.data.stop
            };
        }

        async function fetchAllStops() {
            try {
                const container = document.getElementById('all-stops');
                
                const stopPromises = STOPS.map(stop => fetchSingleStop(stop));
                const stopsResults = await Promise.all(stopPromises);
                
                container.innerHTML = ''; 

                stopsResults.forEach(result => {
                    const stop = result.data;
                    const customTitle = result.customTitle;

                    if (!stop) return; 

                    let stopHtml = `
                        <div class="stop-container">
                            <h2>${customTitle}</h2>
                    `;

                    if (stop.stoptimesWithoutPatterns.length === 0) {
                        stopHtml += `
                            <div class="departure">
                                <div class="destination">Ei lähtöjä lähiaikoina</div>
                            </div>
                        `;
                    } else {
                        stop.stoptimesWithoutPatterns.forEach(dep => {
                            const time = formatTime(dep.realtimeDeparture);
                            const line = dep.trip.route.shortName;
                            const destination = dep.headsign || 'Päätepysäkki';

                            stopHtml += `
                                <div class="departure">
                                    <div class="time">${time}</div>
                                    <div class="line">${line}</div>
                                    <div class="destination">${destination}</div>
                                </div>
                            `;
                        });
                    }

                    stopHtml += `</div>`;
                    container.innerHTML += stopHtml;
                });

            } catch (error) {
                document.getElementById('all-stops').innerHTML = `
                    <div class="error">Virhe ladatessa tietoja:<br>${error.message}</div>
                `;
            }
        }

        fetchAllStops();
        setInterval(fetchAllStops, 60000);
    </script>
</body>
</html>
